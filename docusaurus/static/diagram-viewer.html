<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diagram viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f141a;
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="viewer" title="Hosted diagram viewer"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file') || params.get('url') || '/assets/knowledgeontology/diagrams/GXP-Architecture.drawio';
    const title = params.get('title') || 'Diagram.drawio';
    const nav = params.get('nav') || '1';
    const layers = params.get('layers') || '1';
    const lightbox = params.get('lightbox') || '1';
    const page = params.get('page');

    if (!file) {
      document.body.innerHTML = '<p style="color:#f1eadf;font-family:Inter,system-ui,sans-serif;padding:16px;">Missing diagram file.</p>';
    } else {
      const absoluteUrl = new URL(file, window.location.origin).toString();
      const viewerUrl = new URL('/viewer/', window.location.origin);
      viewerUrl.searchParams.set('lightbox', lightbox);
      viewerUrl.searchParams.set('layers', layers);
      viewerUrl.searchParams.set('nav', nav);
      viewerUrl.searchParams.set('title', title);
      viewerUrl.searchParams.set('url', absoluteUrl);
      if (page !== null && page !== '') {
        viewerUrl.searchParams.set('page', page);
      }
      document.getElementById('viewer').src = viewerUrl.toString();
    }
  </script>
</body>
</html>
