name: deploy

on:
  push:
    branches:
      - master
      - develop

permissions:
  contents: write

jobs:
  detect_changes:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    outputs:
      upload_diagrams: ${{ steps.detect.outputs.upload_diagrams }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            mapfile -t CHANGED < <(git ls-files)
          else
            mapfile -t CHANGED < <(git diff --name-only "$BEFORE" "$AFTER")
          fi

          echo "Changed files:"
          printf '%s\n' "${CHANGED[@]}"

          upload=false
          for file in "${CHANGED[@]}"; do
            if [[ "$file" == docusaurus/static/assets/gxp/diagrams/*.drawio ]]; then
              upload=true
              break
            fi
          done

          echo "upload_diagrams=$upload" >> "$GITHUB_OUTPUT"

  mirror_diagrams:
    needs: detect_changes
    if: needs.detect_changes.outputs.upload_diagrams == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate diagram mirror metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('docusaurus/static/assets/gxp/diagrams')
          files = sorted(root.glob('*.drawio'))

          data = {
            'source': str(root).replace('\\\\', '/'),
            'count': len(files),
            'files': [
              {
                'name': f.name,
                'sizeBytes': f.stat().st_size,
                'sha256': hashlib.sha256(f.read_bytes()).hexdigest(),
              }
              for f in files
            ],
          }

          out = root / '.diagram-mirror.json'
          out.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print(f'wrote {out}')
          PY

      - name: Commit diagram mirror metadata updates
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain docusaurus/static/assets/gxp/diagrams/.diagram-mirror.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docusaurus/static/assets/gxp/diagrams/.diagram-mirror.json
            git commit -m "chore: update drawio mirror metadata [skip ci]"
            git push
          else
            echo "No diagram metadata changes to commit"
          fi

  deploy_site:
    needs: detect_changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Ensure LFS objects for site build
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="docusaurus/static/**"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docusaurus/package-lock.json

      - name: Install Docusaurus dependencies
        working-directory: docusaurus
        run: npm ci

      - name: Build Docusaurus
        working-directory: docusaurus
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docusaurus/build
          cname: governance.foundation
