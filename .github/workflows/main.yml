name: deploy

on:
  push:
    branches:
      - master
      - develop

jobs:
  detect_changes:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    outputs:
      upload_diagrams: ${{ steps.detect.outputs.upload_diagrams }}
      only_diagrams: ${{ steps.detect.outputs.only_diagrams }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            mapfile -t CHANGED < <(git ls-files)
          else
            mapfile -t CHANGED < <(git diff --name-only "$BEFORE" "$AFTER")
          fi

          echo "Changed files:"
          printf '%s\n' "${CHANGED[@]}"

          upload=false
          only=true

          if [ ${#CHANGED[@]} -eq 0 ]; then
            only=false
          fi

          for file in "${CHANGED[@]}"; do
            if [[ "$file" == _gxp/diagrams/*.drawio ]]; then
              upload=true
            else
              only=false
            fi
          done

          echo "upload_diagrams=$upload" >> "$GITHUB_OUTPUT"
          echo "only_diagrams=$only" >> "$GITHUB_OUTPUT"

  upload_diagrams:
    needs: detect_changes
    if: needs.detect_changes.outputs.upload_diagrams == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diagrams to Google Drive
        uses: jannekem/run-python-script-action@v1
        with:
          script: |
            from pathlib import Path
            from mirror.drawio_to_gdrive import DrawioTransferService
            from mirror.settings import settings

            transfer_service = DrawioTransferService(settings)
            transfer_service.process(Path('_gxp/diagrams'))

      - name: Commit diagram metadata updates
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain _gxp/diagrams/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _gxp/diagrams/
            git commit -m "chore: update gdrive diagram statistics [skip ci]"
            git push
          else
            echo "No diagram metadata changes to commit"
          fi

  deploy_site:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.only_diagrams != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docusaurus/package-lock.json

      - name: Install Docusaurus dependencies
        working-directory: docusaurus
        run: npm ci

      - name: Build Docusaurus
        working-directory: docusaurus
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docusaurus/build
          cname: governance.foundation
